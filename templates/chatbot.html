<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medicate Chatbot</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='chatbot.css') }}?v=6" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="chatbot-page">
  <nav class="simple-nav">
    <a href="{{ url_for('home') }}" class="simple-nav-brand">Medicate</a>
    <div class="simple-nav-actions">
      <a href="{{ url_for('home') }}" class="simple-nav-link">Home</a>
      {% if username and username != 'Guest' %}
      <a href="{{ url_for('logout') }}" class="simple-nav-link">Logout</a>
      {% else %}
      <a href="{{ url_for('login') }}" class="simple-nav-link">Login</a>
      {% endif %}
    </div>
  </nav>

  <main class="main-wrapper">
    <header class="hero-section">
      <button class="try-demo-btn">Click here to upgrade your plan</button>
    </header>

    <div class="chat-main-area">
      <div class="chat-container">
        <div class="chat-header">
          <div>
            <h2>Medicate Chatbot</h2>
            <p>Your personal health assistant</p>
          </div>
          <div class="header-actions">
            <button class="clear-chat-btn">Clear chat</button>
            <button class="history-btn">History</button>
          </div>
        </div>

        <div class="history-panel" id="history-panel">
          <div class="history-panel-header">
            <span>Past Messages</span>
            <button id="close-history-btn">&times;</button>
          </div>
          <div class="history-list" id="history-list"></div>
        </div>

        <div class="chat-box" id="chat-box"></div>
        <div class="input-area">
          <input type="text" id="user-input" placeholder="Enter Your Message..." />
          <button onclick="sendMessage()" class="send-btn">
            <img src="https://img.icons8.com/ios-filled/24/ffffff/sent.png" alt="Send" />
          </button>
        </div>
      </div>
    </div>
  </main>
  {% include 'partials/shared_footer.html' %}

  <script>
    window.username = "{{ username }}";
  </script>
  <script src="{{ url_for('static', filename='chatbot.js') }}"></script>
  <script src="{{ url_for('static', filename='homepage.js') }}"></script>
</body>

</html>
